name: Terraform Infrastructure   # Name of the GitHub Actions workflow

on:
  workflow_dispatch:             # Allows manual trigger from GitHub UI
    inputs:

      STAGE:                     # Input to select what to create
        description: "Select Infrastructure Stage"  # Label shown in UI
        required: true           # User must select an option
        default: "all"           # Default option
        type: choice            # Dropdown selection
        options:
          - ec2                 # Only EC2 module
          - s3                  # Only S3 module
          - all                 # Both EC2 + S3

      ACTION:                    # Input to choose apply or destroy
        description: "Terraform Action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply               # Create infrastructure
          - destroy             # Delete infrastructure

      INSTANCE_TYPE:             # Optional EC2 size input
        description: "EC2 Instance Type"
        required: false
        default: "t2.micro"     # Default instance type

jobs:
  terraform:
    runs-on: ubuntu-latest       # Use Ubuntu runner provided by GitHub

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4   # Pulls your GitHub repo into runner

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4  # Authenticates AWS
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}     # Access key from GitHub Secrets
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # Secret key
          aws-region: ap-south-1     # AWS region (Mumbai)

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3   # Installs Terraform CLI

      - name: Terraform Init
        run: terraform init   # Initializes backend, downloads providers

      - name: Terraform Validate
        run: terraform validate   # Checks syntax errors in Terraform code

      # 🔥 IMPORTANT LOGIC: Pass STAGE to Terraform
      - name: Terraform Plan
        run: |
          terraform plan \
          -var="stage=${{ github.event.inputs.STAGE }}" \   # Pass stage (ec2/s3/all)
          -var="instance_type=${{ github.event.inputs.INSTANCE_TYPE }}" # Pass instance type

      - name: Terraform Apply
        if: ${{ github.event.inputs.ACTION == 'apply' }}   # Run only if user selects apply
        run: |
          terraform apply -auto-approve \   # Apply without manual approval
          -var="stage=${{ github.event.inputs.STAGE }}" \
          -var="instance_type=${{ github.event.inputs.INSTANCE_TYPE }}"

      - name: Terraform Destroy
        if: ${{ github.event.inputs.ACTION == 'destroy' }}  # Run only if destroy selected
        run: |
          terraform destroy -auto-approve \  # Destroy infra
          -var="stage=${{ github.event.inputs.STAGE }}" \
          -var="instance_type=${{ github.event.inputs.INSTANCE_TYPE }}"

      - name: Show Outputs
        if: ${{ github.event.inputs.ACTION == 'apply' }}   # Only after apply
        run: terraform output   # Displays outputs like EC2 IP, S3 ID

      - name: Cleanup Workspace
        if: always()            # Runs even if pipeline fails
        run: |
          echo "Cleaning workspace..."   # Print message
          rm -rf *                      # Deletes all files in runner
          echo "Workspace cleaned ✅"   # Confirmation message