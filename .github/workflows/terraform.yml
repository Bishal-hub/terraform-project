name: Terraform Infra

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Select Resource"
        required: true
        default: "all"
        type: choice
        options:
          - ec2
          - s3
          - all
      action:
        description: "Select Action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: |
          if [ "${{ github.event.inputs.stage }}" = "ec2" ]; then
            terraform plan -target=module.ec2
          elif [ "${{ github.event.inputs.stage }}" = "s3" ]; then
            terraform plan -target=module.s3
          else
            terraform plan
          fi

      - name: Terraform apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          if [ "${{ github.event.inputs.stage }}" = "ec2" ]; then
            terraform apply -auto-approve -target=module.ec2
          elif [ "${{ github.event.inputs.stage }}" = "s3" ]; then
            terraform apply -auto-approve -target=module.s3
          else
            terraform apply -auto-approve
          fi

      - name: Terraform destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          if [ "${{ github.event.inputs.stage }}" = "ec2" ]; then
            terraform destroy -auto-approve -target=module.ec2
          elif [ "${{ github.event.inputs.stage }}" = "s3" ]; then
            terraform destroy -auto-approve -target=module.s3
          else
            terraform destroy -auto-approve
          fi

      - name: Show Terraform outputs
        run: terraform output
