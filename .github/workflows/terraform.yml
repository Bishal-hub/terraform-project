name: Terraform Infra                                               # Workflow name

on:

  workflow_dispatch:                                                # Manual workflow trigger

    inputs:

      stage:                                                        # Resource selection input

        description: "Select Resource"                              # Dropdown label

        required: true                                              # Mandatory input

        default: "all"                                              # Default option

        type: choice                                                # Dropdown menu

        options:
          - ec2                                                     # Create only EC2
          - s3                                                      # Create only S3
          - all                                                     # Create both resources

      action:                                                       # Action selection input

        description: "Select Action"                                # Dropdown label

        required: true                                              # Mandatory input

        default: "apply"                                            # Default action

        type: choice                                                # Dropdown menu

        options:
          - apply                                                   # Create infrastructure
          - destroy                                                 # Delete infrastructure

      instance_type:                                                # EC2 type input

        description: "EC2 Instance Type"                            # Input label

        required: false                                             # Optional field

        default: "t2.micro"                                         # Default EC2 type

jobs:

  terraform:                                                        # Job name

    runs-on: ubuntu-latest                                          # GitHub runner OS

    steps:

      - name: Checkout Code                                         # Pull repository code
        uses: actions/checkout@v4                                   # GitHub checkout action

      - name: Configure AWS                                         # Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4              # AWS authentication action

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}       # AWS access key
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # AWS secret key
          aws-region: ap-south-1                                    # AWS region

      - name: Setup Terraform                                       # Install Terraform
        uses: hashicorp/setup-terraform@v3                          # Terraform setup action

      - name: Terraform Init                                        # Initialize Terraform
        run: terraform init                                         # Initialize backend and providers

      - name: Terraform Validate                                    # Validate Terraform code
        run: terraform validate                                     # Validate configuration

      - name: Terraform Plan                                        # Terraform plan step
        run: |

          if [ "${{ github.event.inputs.stage }}" == "ec2" ]; then  # If EC2 selected
            terraform plan -lock=false -target=module.ec2           # Plan only EC2

          elif [ "${{ github.event.inputs.stage }}" == "s3" ]; then # If S3 selected
            terraform plan -lock=false -target=module.s3            # Plan only S3

          else                                                      # If ALL selected
            terraform plan -lock=false                              # Plan all resources

          fi                                                        # End if condition

      - name: Terraform Apply                                       # Terraform apply step
        if: ${{ github.event.inputs.action == 'apply' }}            # Run only for apply action
        run: |

          if [ "${{ github.event.inputs.stage }}" == "ec2" ]; then  # If EC2 selected
            terraform apply -lock=false -auto-approve -target=module.ec2 # Apply only EC2

          elif [ "${{ github.event.inputs.stage }}" == "s3" ]; then # If S3 selected
            terraform apply -lock=false -auto-approve -target=module.s3 # Apply only S3

          else                                                      # If ALL selected
            terraform apply -lock=false -auto-approve               # Apply all resources

          fi                                                        # End if condition

      - name: Terraform Destroy                                     # Terraform destroy step
        if: ${{ github.event.inputs.action == 'destroy' }}          # Run only for destroy action
        run: |

          if [ "${{ github.event.inputs.stage }}" == "ec2" ]; then  # If EC2 selected
            terraform destroy -lock=false -auto-approve -target=module.ec2 # Destroy only EC2

          elif [ "${{ github.event.inputs.stage }}" == "s3" ]; then # If S3 selected
            terraform destroy -lock=false -auto-approve -target=module.s3 # Destroy only S3

          else                                                      # If ALL selected
            terraform destroy -lock=false -auto-approve             # Destroy all resources

          fi                                                        # End if condition

      - name: Terraform Output                                      # Show Terraform outputs
        if: ${{ github.event.inputs.action == 'apply' }}            # Run only after apply
        run: terraform output                                       # Display outputs